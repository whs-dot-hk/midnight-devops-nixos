[package]
name = "midnight-fetch-secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTPS in-process (rustls + bundled roots), so the unit needs neither curl nor
# a system CA bundle at runtime.
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# chown / getpwnam / umask.
libc = "0.2"

[profile.release]
strip = true
